# Quality gates for every pull request.
#
# Four independent jobs, so one failure tells you which gate broke rather than
# just "CI is red": lint, tests, the docs build, and the package build.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the previous run. Pushes to the default
# branch are not cancelled, since those results are what the badge reports.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Ruff only: no need to install the package or JAX to lint it.
      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check --output-format=github .

      # Advisory, not a gate. The tree is not ruff-formatted, and reformatting it
      # wholesale would rewrite files the project has not chosen to rewrite. The
      # diff is printed so the drift stays visible.
      - name: ruff format (advisory)
        continue-on-error: true
        run: ruff format --check --diff .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # The `newton` extra is deliberately absent: it pulls in Warp and downloads
      # the Franka asset on first use. tests/test_envs.py `importorskip`s it, so
      # the robot tests skip here and run on a machine that has a GPU.
      #
      # The dataset format libraries *are* in `dev`, because the readers in
      # xwm.datasets are tested against fixtures written into tmp_path in the
      # real formats. Nothing here touches the network: the tests that download
      # are gated on XWM_DATASET_TESTS=1 and never run in CI.
      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -q --durations=10

      - name: Import without the optional extras
        run: |
          python -c "import xwm; print(xwm.__version__); print(xwm.families.available())"
          python -c "import xwm; print(xwm.envs.which_backends())"
          python -c "import xwm; print(len(xwm.datasets.available()), 'datasets'); print(xwm.datasets.which_readers())"

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The API reference imports the package, so the docs extra is additive.
      - name: Install
        run: pip install -e ".[docs]"

      # --strict fails on a broken link, a bad anchor or an unresolved reference.
      # Missing example figures are stubbed by docs/hooks/figures.py, so a
      # checkout that has never run an example still builds.
      - name: mkdocs build --strict
        run: mkdocs build --strict

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      # A wheel that imports is the minimum bar for a release candidate.
      - name: Install the wheel and import it
        run: |
          pip install dist/*.whl
          cd "$(mktemp -d)"
          python -c "import xwm; print(xwm.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
