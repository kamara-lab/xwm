[project]
name = "xwm"
version = "0.1.0"
description = "xwm: building blocks for predictive world models in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kleyton Costa" }]
keywords = ["jax", "world-models", "jepa", "self-supervised", "robotics", "planning"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jax>=0.4.38",
  "equinox>=0.11.8",
  "optax>=0.2.4",
  "numpy>=1.26",
  "einops>=0.8.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8", "pillow>=10.0"]
# Newton needs GitPython to fetch robot assets and trimesh/pycollada to read
# the Franka URDF's meshes; none of them are Newton install-time requirements.
newton = [
  "newton>=1.5",
  "warp-lang>=1.16",
  "GitPython>=3.1",
  "trimesh>=4.0",
  "pycollada>=0.8",
  "usd-core>=25.0",           # ViewerUSD: export a stage for offline rendering
]
# Photorealistic rendering through Newton's OVRTX path tracer. NVIDIA GPUs only;
# on other platforms use the "usd" backend and render the stage offline.
render = [
  "ovrtx",                    # the path tracer itself
  "pyglet>=2.0",              # ViewerRTX's camera maths, headless included
]
# Readers for recorded datasets (xwm.datasets). Everything here is a *format*
# dependency, not a framework: parquet and mp4 for the LeRobot layout, HDF5 for
# LIBERO and RoboMimic. OGBench needs nothing beyond the standard library, which
# is why that reader works on a bare install.
#
# `tensorflow-datasets` is deliberately absent even though xwm.datasets.rlds
# needs it. It brings TensorFlow, whose CUDA pins fight JAX's on any GPU box --
# the same trap as `--all-extras` and ovrtx. That reader asks for it by name at
# call time, and most Open X-Embodiment data is reachable through its LeRobot
# mirrors without it.
data = [
  "huggingface-hub>=0.26",    # resolve and cache datasets from the Hub
  "pyarrow>=17",              # LeRobot keeps states and actions in parquet
  "av>=12",                   # decode one episode's frame span out of an mp4 shard
  "h5py>=3.11",               # LIBERO and RoboMimic
  "pillow>=10.0",             # resizing, and LIBERO's JPEG-compressed frames
]
dev = [
  "pytest>=8.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "ruff>=0.6",
  # The dataset readers are tested against fixtures written in the real on-disk
  # formats, so CI needs the format libraries even though it never downloads
  # anything. Same reason `plots`' deps are duplicated here.
  "huggingface-hub>=0.26",
  "pyarrow>=17",
  "av>=12",
  "h5py>=3.11",
  # tests/test_rerun.py writes recordings into tmp_path and reads them back;
  # no viewer and no display are involved.
  "rerun-sdk>=0.36",
]
# The API reference imports the package, so `docs` is additive to the core install
# rather than standalone.
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]
rerun = [
    "rerun-sdk>=0.36",
]

[project.scripts]
xwm = "xwm.cli:main"

[project.urls]
Homepage = "https://kamara-lab.github.io/xwm/"
Documentation = "https://kamara-lab.github.io/xwm/"
Repository = "https://github.com/kamara-lab/xwm"
Issues = "https://github.com/kamara-lab/xwm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xwm"]

# Without this, hatchling sweeps the whole working tree into the sdist: the 20 MB
# of generated GIFs and USD stages under examples/outputs, the LaTeX intermediates
# beside the TikZ diagram, and anything untracked that happens to be lying around.
# A source distribution needs the package, the tests that specify its behaviour,
# and the example scripts, so it lists those rather than excluding the rest.
[tool.hatch.build.targets.sdist]
only-include = ["xwm", "tests", "examples", "configs", "README.md", "pyproject.toml"]
exclude = ["examples/outputs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]
